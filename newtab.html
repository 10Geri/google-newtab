<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<title>Új lap</title>
<link rel="icon" type="image/svg+xml" href="google.svg">
<style>
  :root {
    color-scheme: dark light;

    /* --- ízlés szerint állítható --- */
    --box-width: 1100px;     /* a keresőmező szélessége */
    --box-height: 60px;

    --bg: #1b1c1e;
    --fg: #e8eaed;
    --muted: #9aa0a6;
    --faint: #5f6368;
    --field: #2a2b2e;
    --field-focus: #35363a;
    --border: #3c4043;
    --hover: rgba(255, 255, 255, .07);
    --shadow: 0 8px 28px rgba(0, 0, 0, .45);
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #ffffff;
      --fg: #202124;
      --muted: #70757a;
      --faint: #bdc1c6;
      --field: #ffffff;
      --field-focus: #ffffff;
      --border: #dfe1e5;
      --hover: rgba(0, 0, 0, .05);
      --shadow: 0 8px 24px rgba(0, 0, 0, .14);
    }
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 24px;
  }

  main {
    width: 100%;
    max-width: var(--box-width);
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-top: 2vh;
  }

  /* ---------- óra ---------- */
  .clock {
    font-size: clamp(56px, 9vw, 104px);
    font-weight: 200;
    letter-spacing: -.03em;
    line-height: 1;
    font-variant-numeric: tabular-nums;
    margin: 0;
  }
  .date {
    margin: 12px 0 0;
    color: var(--muted);
    font-size: 15px;
    letter-spacing: .04em;
  }

  /* ---------- kép ---------- */
  .banner {
    display: block;
    width: 100%;
    height: clamp(280px, 60vh, 680px);
    margin-top: 28px;
    object-fit: cover;
    object-position: center 60%;
    border-radius: 24px;
  }

  /* fókuszált kereső: a kép a kereső alá kerül (newtab.js: swap) */
  main.swapped .banner { order: 1; }
  main.swapped .links { order: 2; }

  /* ---------- kereső ---------- */
  .search {
    position: relative;
    width: 100%;
    margin-top: 32px;
  }

  form {
    display: flex;
    align-items: center;
    gap: 16px;
    height: var(--box-height);
    padding: 0 12px 0 22px;
    background: var(--field);
    border: 1px solid var(--border);
    border-radius: calc(var(--box-height) / 2);
    transition: background .15s, box-shadow .15s, border-color .15s;
  }
  .search.open form {
    border-radius: calc(var(--box-height) / 2) calc(var(--box-height) / 2) 0 0;
    border-bottom-color: transparent;
  }
  form:focus-within {
    background: var(--field-focus);
    box-shadow: var(--shadow);
  }

  .icon { width: 20px; height: 20px; flex: none; fill: var(--muted); }

  input[type="text"] {
    flex: 1 1 auto;
    min-width: 0;
    height: 100%;
    background: none;
    border: 0;
    outline: none;
    color: var(--fg);
    font: inherit;
    font-size: 17px;
  }

  button {
    flex: none;
    background: none;
    border: 0;
    border-radius: 18px;
    padding: 9px 18px;
    color: var(--muted);
    font: inherit;
    font-size: 14px;
    cursor: pointer;
  }
  button:hover { color: var(--fg); background: var(--hover); }

  /* ---------- javaslatok ---------- */
  ul.suggest {
    position: absolute;
    left: 0;
    right: 0;
    top: var(--box-height);
    margin: 0;
    padding: 8px 0 12px;
    list-style: none;
    background: var(--field-focus);
    border: 1px solid var(--border);
    border-top: 0;
    border-radius: 0 0 24px 24px;
    box-shadow: var(--shadow);
    z-index: 2;
  }
  ul.suggest[hidden] { display: none; }
  ul.suggest li {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 9px 22px;
    cursor: pointer;
    color: var(--fg);
  }
  ul.suggest li .icon { fill: var(--faint); }
  ul.suggest li:hover,
  ul.suggest li.on { background: var(--hover); }

  /* ---------- gyorslinkek ---------- */
  .links { margin: 28px 0 0; display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
  .links a {
    color: var(--muted);
    text-decoration: none;
    font-size: 14px;
    padding: 8px 14px;
    border-radius: 16px;
  }
  .links a:hover { color: var(--fg); background: var(--hover); }

  /* ---------- jobb felső sáv ---------- */
  .topbar {
    position: fixed;
    top: 12px;
    right: 16px;
    display: flex;
    align-items: center;
    gap: 4px;
    z-index: 3;
  }
  .topbar > a {
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--fg);
    text-decoration: none;
    font-size: 14px;
    padding: 6px 12px;
    border-radius: 18px;
  }
  .topbar > a img { width: 20px; height: 20px; }
  .topbar > a:hover { background: var(--hover); }

  .apps { position: relative; }
  .apps > button {
    display: flex;
    padding: 10px;
    border-radius: 50%;
  }
  .apps > button .icon { width: 24px; height: 24px; }
  .apps > button[aria-expanded="true"] { background: var(--hover); }

  .apps-panel {
    position: absolute;
    top: calc(100% + 8px);
    right: 0;
    width: 328px;
    max-height: min(480px, calc(100vh - 80px));
    overflow-y: auto;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 4px;
    padding: 16px;
    background: var(--field-focus);
    border: 1px solid var(--border);
    border-radius: 24px;
    box-shadow: var(--shadow);
  }
  .apps-panel[hidden] { display: none; }
  .apps-panel a {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    padding: 12px 4px 10px;
    border-radius: 16px;
    color: var(--fg);
    text-decoration: none;
    font-size: 13px;
    text-align: center;
  }
  .apps-panel a img { width: 40px; height: 40px; }
  .apps-panel a:hover { background: var(--hover); }
</style>
</head>
<body>
  <nav class="topbar">
    <a href="https://mail.google.com/"><img src="icons/apps/gmail.png" alt="">Gmail</a>
    <a href="https://drive.google.com/"><img src="icons/apps/drive.png" alt="">Drive</a>
    <a href="https://contacts.google.com/"><img src="icons/apps/contacts.png" alt="">Névjegyek</a>
    <div class="apps" id="apps">
      <button type="button" id="apps-btn" aria-label="Google-alkalmazások"
              aria-expanded="false" aria-controls="apps-panel">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M6 8a2 2 0 1 0 0-4 2 2 0 0 0 0 4zm6 0a2 2 0 1 0 0-4 2 2 0 0 0 0 4zm6 0a2 2 0 1 0 0-4 2 2 0 0 0 0 4zM6 14a2 2 0 1 0 0-4 2 2 0 0 0 0 4zm6 0a2 2 0 1 0 0-4 2 2 0 0 0 0 4zm6 0a2 2 0 1 0 0-4 2 2 0 0 0 0 4zM6 20a2 2 0 1 0 0-4 2 2 0 0 0 0 4zm6 0a2 2 0 1 0 0-4 2 2 0 0 0 0 4zm6 0a2 2 0 1 0 0-4 2 2 0 0 0 0 4z"/>
        </svg>
      </button>
      <div class="apps-panel" id="apps-panel" hidden>
        <a href="https://myaccount.google.com/"><img src="icons/apps/account.png" alt="">Fiók</a>
        <a href="https://www.google.com/"><img src="icons/apps/search.png" alt="">Kereső</a>
        <a href="https://gemini.google.com/"><img src="icons/apps/gemini.png" alt="">Gemini</a>
        <a href="https://maps.google.com/"><img src="icons/apps/maps.png" alt="">Térkép</a>
        <a href="https://www.youtube.com/"><img src="icons/apps/youtube.png" alt="">YouTube</a>
        <a href="https://play.google.com/"><img src="icons/apps/play.png" alt="">Play</a>
        <a href="https://news.google.com/"><img src="icons/apps/news.png" alt="">Hírek</a>
        <a href="https://mail.google.com/"><img src="icons/apps/gmail.png" alt="">Gmail</a>
        <a href="https://meet.google.com/"><img src="icons/apps/meet.png" alt="">Meet</a>
        <a href="https://chat.google.com/"><img src="icons/apps/chat.png" alt="">Chat</a>
        <a href="https://contacts.google.com/"><img src="icons/apps/contacts.png" alt="">Névjegyek</a>
        <a href="https://drive.google.com/"><img src="icons/apps/drive.png" alt="">Drive</a>
        <a href="https://calendar.google.com/"><img src="icons/apps/calendar.png" alt="">Naptár</a>
        <a href="https://translate.google.com/"><img src="icons/apps/translate.png" alt="">Fordító</a>
        <a href="https://photos.google.com/"><img src="icons/apps/photos.png" alt="">Fotók</a>
        <a href="https://docs.google.com/document/"><img src="icons/apps/docs.png" alt="">Dokumentumok</a>
        <a href="https://docs.google.com/spreadsheets/"><img src="icons/apps/sheets.png" alt="">Táblázatok</a>
        <a href="https://docs.google.com/presentation/"><img src="icons/apps/slides.png" alt="">Diák</a>
        <a href="https://docs.google.com/forms/"><img src="icons/apps/forms.png" alt="">Űrlapok</a>
        <a href="https://keep.google.com/"><img src="icons/apps/keep.png" alt="">Keep</a>
        <a href="https://sites.google.com/"><img src="icons/apps/sites.png" alt="">Webhelyek</a>
        <a href="https://classroom.google.com/"><img src="icons/apps/classroom.png" alt="">Classroom</a>
        <a href="https://earth.google.com/"><img src="icons/apps/earth.png" alt="">Earth</a>
        <a href="https://www.blogger.com/"><img src="icons/apps/blogger.png" alt="">Blogger</a>
      </div>
    </div>
  </nav>

  <main>
    <p class="clock" id="clock">--:--</p>
    <p class="date" id="date"></p>
    <img class="banner" src="Denmark.jpg" alt="Koppenhága, Nyhavn">

    <!-- Szándékosan nincs autofocus és nincs „bárhová gépelsz" kezelő:
         így a Chrome a kurzort a címsávban hagyja. -->
    <div class="search" id="search">
      <form action="https://www.google.com/search" method="GET" role="search" id="form">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
        </svg>
        <input type="text" id="q" name="q" aria-label="Keresés a Google-ben"
               autocomplete="off" spellcheck="false"
               role="combobox" aria-expanded="false" aria-controls="suggest">
        <button type="submit">Keresés</button>
      </form>
      <ul class="suggest" id="suggest" role="listbox" hidden></ul>
    </div>

    <p class="links">
      <a href="https://www.google.com/">Google</a>
      <a href="https://mail.google.com/">Gmail</a>
      <a href="https://www.youtube.com/">YouTube</a>
    </p>
  </main>

  <script src="newtab.js"></script>
</body>
</html>
